name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android-app/**"
      - "renderer/services.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Debug APK derle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      # Her derleme yeni bir sürüm numarası alır; telefon güncellemeyi böyle tanır.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v3

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Web varlıklarını Android projesine kopyala
        run: npm run sync

      - name: APK derle
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk aria-music.apk

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: aria-music-apk
          path: android-app/aria-music.apk
          retention-days: 30

      - name: Releases sayfasına ham APK olarak ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.ANDROID_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Aria Music Android v${{ env.ANDROID_VERSION_NAME }}
          body: |
            Otomatik derlenen Android APK'sı (debug imzalı).

            📱 Telefona kurmak için aşağıdaki `aria-music.apk` dosyasını indirip aç.

            Kaynak: `${{ github.ref_name }}` @ ${{ github.sha }}
          files: android-app/aria-music.apk
          fail_on_unmatched_files: true
